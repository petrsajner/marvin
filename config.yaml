# Built-in models and measured profiles are maintained in harness/config.py and
# harness/measured_profiles.py. Add custom model keys under models if needed.
server:
  host: 127.0.0.1
  port: 8080
  n_gpu_layers: 999
  extra_args: []
hardware:
  vram_gb: auto
default_model: q5
sampling:
  thinking:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    presence_penalty: 0.0
  non_thinking:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
thinking: true
reasoning_effort: xhigh
work_mode: development
agent:
  mode: agent
  autonomy: supervised
  max_steps: 0
  semi_max_steps: 0
  shell_timeout: 60
  workspace: null
computer:
  screenshot_max_edge: 1920
  screenshot_grayscale: false
  failsafe: true
  pause_between_actions: 0.15
memory:
  directory: memory
  global_filename: GLOBAL.md
  modes_directory: modes
  development_filename: MEMORY.md
  project_filename: QWEN_MEMORY.md
skills:
  directory: skills
  user_directory: user-skills
  project_directory: .qwen-skills
web:
  host: 127.0.0.1
  port: 7860
  enabled: true
  backend: google
  timeout: 10
  max_chars: 12000
  research_source_max_chars: 200000
  document_max_bytes: 50000000
  search_results: 5
paths:
  runtime_dir: runtime
  llama_dir: runtime/llama
  models_dir: runtime/models
  sessions_dir: sessions
